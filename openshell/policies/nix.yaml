version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /bin
    - /nix
    - /nix/store
    - /dev/urandom
  read_write:
    - /tmp
    - /sandbox
    - /home
    - /env
    - /dev/null
    - /root/.pi
    - /root/.config
    - /root/.cache
landlock:
  compatibility: best_effort