# Sandbox policy for `nix build` sandboxes (nix-builder image).
#
# No providers attached: everything the build needs must be admitted here
# explicitly. /nix is READ-WRITE (the store grows during the build) —
# unlike the read-only /nix in the default home-manager policy.
#
# Optional: attach the github-agent provider when a flake input is a
# private repo (unauthenticated api.github.com is rate-limited to 60
# requests/hour, which flake lock resolution can burn through quickly).
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /nix
    - /home
    - /env
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  nix_binary_cache:
    name: nix_binary_cache
    endpoints:
      - host: cache.nixos.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /nix/store/*-nix-*/bin/nix }

  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /nix/store/*-git-*/bin/git }
      - { path: /nix/store/*-nix-*/bin/nix }

  # Uncomment if the project uses FlakeHub (this fleet's release flow does):
  # flakehub:
  #   name: flakehub
  #   endpoints:
  #     - host: api.flakehub.io
  #       port: 443
  #       protocol: rest
  #       enforcement: enforce
  #       access: read-only
  #     - host: flakehub.io
  #       port: 443
  #       protocol: rest
  #       enforcement: enforce
  #       access: read-only
  #   binaries:
  #     - { path: /nix/store/*-nix-*/bin/nix }
