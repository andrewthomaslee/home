# GENERATED TEMPLATE — never hand-write store paths in `binaries:`. The
# @bin_*@ placeholders are rendered by the flake
# (packages.github-agent-profile, flake-parts/openshellConfig.nix) with
# the EXACT store paths of the code-agent image's package set, so the
# gateway's binary pins and the image can never drift apart.
# Lifecycle: `code-sandbox sync` renders + drift-checks + pushes
# (`openshell profile update`); `code-sandbox doctor` reports read-only;
# `code-sandbox create` syncs automatically. `openshell profile import`
# is ONE-SHOT — after editing this file, run `code-sandbox sync`;
# re-importing by hand with a stale copy is exactly how the
# github-mcp-server pin got lost on the gateway (its egress died with
# EACCES while gh kept working).
#
# Custom OpenShell provider profile: GitHub with agent write access.
#
# The built-in `github` profile is read-only (no git push, no issues/PRs),
# which is right for generic use but too tight for a coding agent that must
# open PRs. This variant grants read-write on api.github.com and adds the
# git-receive-pack rule so `git push` over smart HTTP works. Use a
# DEDICATED GitHub account/bot for this: create a fine-grained PAT scoped
# to the repos the agent may touch, then:
#
#   export GITHUB_TOKEN=github_pat_...   # the bot account's PAT
#   code-sandbox sync                    # imports/updates this profile on the gateway
#   openshell provider create --name github-agent --type github-agent \
#     --credential GITHUB_TOKEN
#
# ⚠️ Breadth warning: read-write allows POST/PUT/PATCH on every
# api.github.com path (repos, issues, PRs, actions, settings the token can
# see). A compromised sandbox can do anything the PAT can. Scope the PAT
# down (single repo, no admin) rather than widening the profile later.
id: github-agent
resource_version: 1
display_name: GitHub Agent
description: GitHub API and git operations with write access for coding agents
category: source_control
credentials:
  - name: api_token
    description: GitHub token (dedicated bot account PAT recommended)
    env_vars:
      - GITHUB_TOKEN
      - GH_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: api.github.com
    port: 443
    protocol: graphql
    access: read-write
    enforcement: enforce
    path: /graphql
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: GET
          path: "**"
      - allow:
          method: HEAD
          path: "**"
      - allow:
          method: OPTIONS
          path: "**"
      - allow:
          method: POST
          path: "/**/git-upload-pack"
      - allow:
          method: POST
          path: "/**/git-receive-pack"
binaries:
  # EXACT store paths, interpolated by the flake from the same package
  # set the code-agent image is built from. The supervisor matches
  # /proc/pid/exe, not argv[0] or symlinks: gh's kernel-resolved exe is
  # bin/.gh-wrapped (the nixpkgs wrapper), so BOTH are pinned, and the
  # agents' mcp.json wrapper execs the real github-mcp-server, so its
  # exe matches its pin directly. Bump nixpkgs (image store paths
  # change) without re-syncing and these stop matching — that is what
  # `code-sandbox sync`/`doctor` exist to catch.
  - @bin_git@
  - @bin_gh@
  - @bin_gh_wrapped@
  - @bin_github_mcp_server@
inference_capable: false
discovery:
  credentials:
    - api_token
