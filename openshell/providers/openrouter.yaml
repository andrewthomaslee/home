id: openrouter
resource_version: 5
display_name: OpenRouter
description: OpenRouter inference API for OpenCode and Pi Coding Agent
category: inference
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars:
      - OPENROUTER_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /bin/pi
inference_capable: true
discovery:
  credentials:
    - api_key
source: user
scope: workspace